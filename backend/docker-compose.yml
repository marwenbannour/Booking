services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: booking
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking_dev_only
    ports:
      - "5432:5432"
    volumes:
      - booking-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d booking"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - booking-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.25
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build:
      context: .
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://booking:booking_dev_only@postgres:5432/booking?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: replace-with-at-least-32-random-bytes-for-local-development
      JWT_ACCESS_TTL_SECONDS: 600
      JWT_REFRESH_TTL_SECONDS: 604800
      PASSWORD_RESET_TTL_SECONDS: 1800
      EMAIL_CHANGE_TTL_SECONDS: 3600
      FRONTEND_URL: http://localhost:5173
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURE: "false"
      SMTP_FROM: Booking <no-reply@booking.local>
      REFRESH_COOKIE_SAME_SITE: lax
      REFRESH_COOKIE_SECURE: "false"
      CORS_ORIGINS: http://localhost:5173,http://localhost:5500,http://localhost:8081
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    command: ["sh", "-c", "npx prisma migrate deploy && node dist/main.js"]

volumes:
  booking-postgres:
  booking-redis:
